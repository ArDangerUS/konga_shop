<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0f1f17;color:#eef3ee;
     font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:64px;padding:64px 72px;position:relative}
body::after{content:'';position:absolute;left:0;right:0;bottom:0;height:10px;background:#f28b1e}
.logo{height:460px;width:auto;border-radius:14px;display:block;flex:0 0 auto;
      box-shadow:0 18px 50px rgba(0,0,0,.45)}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:21px;letter-spacing:.11em;
         text-transform:uppercase;color:#7ac142;font-weight:500;line-height:1.3}
.dot{width:12px;height:12px;border-radius:50%;background:#7ac142;flex:0 0 auto}
h1{font-family:'DM Serif Display',serif;font-size:92px;font-weight:400;line-height:1}
p{font-size:31px;line-height:1.4;color:#c9d6cc}
.addr{font-size:26px;color:#9fb3a4;border-top:1px solid rgba(255,255,255,.14);padding-top:20px}
.addr b{color:#eef3ee;font-weight:500}
</style></head><body>
<img class="logo" src="LOGO_SRC" alt="">
<div class="col">
  <div class="eyebrow"><span class="dot"></span>Laboratorně testováno na VŠCHT Praha</div>
  <h1>Konga Kratom</h1>
  <p>Prémiový kratom s dohledatelným původem, přímo od licencovaného producenta z Indonésie.</p>
  <div class="addr">Kamenná prodejna: <b>Nuselská 31, Praha 4</b> · Po–Pá 10–19</div>
</div>
</body></html>
